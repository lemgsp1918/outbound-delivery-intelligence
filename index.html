 $('#filters').innerHTML='<label>Demanda<select data-f="d">'+opt('','Todas',ST.f.d)+DEM.map(d=>opt(d.id,d.id+' · '+d.short,ST.f.d)).join('')+'</select></label><label>Responsável<select data-f="r">'+opt('','Todos',ST.f.r)+opt(NOSEL,NOSEL,ST.f.r)+uniq(all.map(t=>t.r).filter(Boolean)).sort((a,b)=>a.localeCompare(b,'pt-BR')).map(n=>opt(n,n,ST.f.r)).join('')+'</select></label><label>Sprint<select data-f="s">'+opt('','Todas',ST.f.s)+sprints().map(n=>opt(n,n,ST.f.s)).join('')+'</select></label><label>Status<select data-f="g">'+opt('','Todos',ST.f.g)+Object.entries(GROUPS).map(([k,v])=>opt(k,v,ST.f.g)).join('')+'</select></label>'+(ST.f.d||ST.f.r||ST.f.s||ST.f.g?'<button class="btn sm" data-act="clrf" style="align-self:flex-end">Limpar filtros</button>':'')+'<span class="sp"></span><span class="dim" style="align-self:flex-end;font-size:12px">'+CX.tasks.length+' de '+cs.tasks.length+' Tasks</span>'+themeSeg()+shotBtn()}
function renderBanner(){const cs=curSnap();$('#banner').innerHTML=cs.demo?'<div class="banner"><b>Dados históricos de demonstração.</b> Baseline do ADO (4TAX-OUTBOUND) de '+fdy(cs.date)+', usado para validar os indicadores. Não é a leitura atual do Azure DevOps.<span class="sp"></span><button class="btn sm" data-nav="data">Importar dados</button></div>':'<div class="banner" style="background:var(--blue-bg);border-color:rgba(59,130,246,.4);color:var(--blue2)">Fonte: <b>'+esc(cs.origin)+'</b> · snapshot de '+fdy(cs.date)+(cs.auto&&cs.ts?' · atualizado em '+new Date(cs.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'.</div>'}
function renderFoot(){const cs=curSnap();$('#sfoot').innerHTML='Snapshot: <b>'+esc(cs.label)+'</b><br>Persistência: '+(ST.persist==='db'?'compartilhada':'só nesta sessão')+'<br>Cap.: '+ST.cfg.cap+' h/dia'}
function render(){try{compute();renderNav();renderFilters();renderBanner();renderFoot();const pg=NAV.find(n=>n[0]===ST.page)||NAV[0];$('#view').innerHTML=pg[2]();renderDrawer()}catch(e){console.error(e);$('#view').innerHTML='<div class="note r">Erro ao renderizar: '+esc(e.message)+'</div>'}}
/* ============ EVENTOS ============ */
const V=document.body;
V.addEventListener('click',async e=>{const t=e.target;
 let el=t.closest('[data-nav]');if(el){ST.page=el.dataset.nav;ST.ui.drawer=null;render();scrollTo(0,0);try{location.hash=ST.page}catch(_){}return}
 el=t.closest('th[data-sort]');if(el){const[id,k]=el.dataset.sort.split('|');const c=ST.sort[id]||{k:null,d:1};ST.sort[id]={k,d:c.k===k?-c.d:1};render();return}
 el=t.closest('[data-tab]');if(el){const[g,k]=el.dataset.tab.split('|');ST.tab[g]=k;renderDrawer();return}
 el=t.closest('[data-act]');if(el){await act(el.dataset.act,el);return}
 if(t.closest('[data-cmp]'))return;
 el=t.closest('tr[data-row]');if(el&&!t.closest('select,button,input,a')){const[k,v]=el.dataset.row.split(':');if(k==='dem'){ST.tab.dem=ST.tab.dem||'prog';openDem(+v)}}});
V.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.f!=null){ST.f[t.dataset.f]=t.value;render();return}
 if(t.dataset.cmp){const id=+t.dataset.cmp;ST.sel=t.checked?ST.sel.concat(id):ST.sel.filter(x=>x!==id);render();return}
 if(t.dataset.cfg){const k=t.dataset.cfg;if(k==='hol')ST.cfg.hol=t.value.split(/[,;\s]+/).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));else if(k==='ref')ST.cfg.ref=t.value;else{const v=parseFloat(t.value);if(!isNaN(v))ST.cfg[k]=v}saveCfg();render();return}
 if(t.dataset.gm){ST.gmap[t.dataset.gm]=t.value;saveCfg();render();return}
 if(t.dataset.ast){const a=ST.actions.find(x=>x.id===t.dataset.ast);if(a){const n=Object.assign({},a,{status:t.value,doneAt:t.value==='Concluída'?today():''});await pset('actions',n);render()}return}
 if(t.dataset.extra){ST.sim.extra[t.dataset.extra]=Math.max(0,parseInt(t.value)||0);render();return}
 if(t.dataset.map){ST.imp.map[t.dataset.map]=parseInt(t.value);analyzeImp();render();return}
 const id=t.id;
 if(id==='rsev'){ST.ui.rsev=t.value;render()}else if(id==='rdem'){ST.ui.rdem=t.value;render()}else if(id==='rrule'){ST.ui.rrule=t.value;render()}
 else if(id==='cmpA'){ST.cmpA=t.value;render()}else if(id==='cmpB'){ST.cmpB=t.value;render()}
 else if(id==='sim-d'){ST.ui.simD=+t.value;ST.ui.simFrom=NOSEL;ST.ui.simH=null;render()}else if(id==='sim-from'){ST.ui.simFrom=t.value;ST.ui.simH=null;render()}else if(id==='sim-to'){ST.ui.simTo=t.value}else if(id==='sim-h'){ST.ui.simH=parseFloat(t.value)}
 else if(id==='imp-date'){ST.imp.date=t.value}else if(id==='imp-label'){ST.imp.label=t.value}else if(id==='imp-rm'){ST.imp.rm=t.checked;analyzeImp();render()}
 else if(id==='impfile'&&t.files[0]){const f=t.files[0];try{if(/\.xls/i.test(f.name)){const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];setImp(X.utils.sheet_to_json(ws,{header:1,defval:''}),f.name)}else setImp(parseCSV(await f.text()),f.name)}catch(err){ST.imp={err:'Não foi possível ler o arquivo ('+(err&&err.message||'erro')+'). Para Excel é preciso carregar a biblioteca XLSX; se estiver bloqueada, exporte como CSV.'}}render()}});
V.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){ST.ui.q=t.value;const p=t.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}}});
async function act(a,el){const d=el.dataset;if(a==='theme'){setTheme(d.v);renderFilters();return}
 if(a==='shot'){shot();return}
 if(a==='shotclose'){const o=$('#shotov');if(o)o.remove();return}
 if(a==='shotdl'){shotDl();return}
 if(a==='closedrawer'){ST.ui.drawer=null;renderDrawer()}
 else if(a==='clrsel'){ST.sel=[];render()}else if(a==='clrf'){ST.f={d:'',r:'',s:'',g:''};render()}
 else if(a==='simadd'){const dm=+$('#sim-d').value,from=$('#sim-from').value,to=$('#sim-to').value,h=parseFloat($('#sim-h').value);if(!(h>0)||from===to){flash('Informe horas > 0 e pessoas diferentes.');return}ST.sim.moves.push({d:dm,from,to,h});ST.ui.simH=null;render()}
 else if(a==='simrm'){ST.sim.moves.splice(+d.i,1);render()}else if(a==='simreset'){ST.sim={moves:[],extra:{}};render()}
 else if(a==='mkaction'){const r=CX.risks.find(x=>x.key===d.rk);if(r){ST.ui.actPre={prob:r.title+': '+r.desc,act:r.rec,dem:r.dem,owner:(r.who&&r.who!==NOSEL)?r.who:'',prio:r.sev==='crit'?'critica':r.sev==='alta'?'alta':r.sev==='med'?'media':'baixa',riskKey:r.key,due:addDays(today(),1)};ST.page='act';ST.ui.drawer=null;render();scrollTo(0,0)}}
 else if(a==='addact'){const prob=$('#a-prob').value.trim(),ac=$('#a-act').value.trim();if(!prob||!ac){flash('Preencha problema e ação.');return}const pre=ST.ui.actPre||{};const o={id:'a'+Date.now().toString(36),prob,act:ac,dem:$('#a-dem').value?+$('#a-dem').value:'',owner:$('#a-own').value,due:$('#a-due').value,prio:$('#a-pri').value,status:'Pendente',createdAt:Date.now(),riskKey:pre.riskKey||'',doneAt:''};ST.ui.actPre=null;await pset('actions',o);render()}
 else if(a==='delact'){await pdel('actions',d.id);render()}else if(a==='afl'){ST.ui.afl=d.v;render()}
 else if(a==='seedact'){const base=Date.now();const S=[['Horas sem responsável nas demandas 133 e 2710','Atribuir responsável às horas sem dono (sugestão: Tech Lead e Douglas)','',  'critica',0],['EPEC não cabe na Entrega ADO','Replanejar a Entrega ADO da EPEC e da 2710, ou reforçar o time (sugestão: PO e Scrum Master)',133,'critica',0],['Sobrecarga de Alécio Silva','Redistribuir as Tasks funcionais da Arq 26.11.1 priorizando 133 e 1170 (sugestão: Scrum Master e Tech Lead)','', 'alta',0],['Tasks em Testes Técnicos com 0 h na 2710','Confirmar o estado real das Tasks e ajustar horas (sugestão: Tech Lead e Douglas)',2710,'alta',2],['Entregas ADO vencendo hoje ou já vencidas','Fechar hoje o que cabe e revisar a Entrega ADO da 42 e da 2705 (sugestão: PO e Scrum Master)','', 'alta',0],['Vínculo da demanda 1740 inferido por título','Validar Feature 1737, US 1738 e Task 1739 e corrigir horas (sugestão: PO e Bernardo)',1740,'media',2],['US aguardando validação HOM e aprovação PRD','Antecipar validação HOM e aprovação PRD das US abertas (sugestão: PO e QA)','', 'media',5]];
  for(let i=0;i<S.length;i++){const s=S[i];await pset('actions',{id:'seed'+base+i,prob:s[0],act:s[1],dem:s[2],owner:'',due:addDays(today(),s[4]),prio:s[3],status:'Pendente',createdAt:base+i,riskKey:'',doneAt:''})}render()}
 else if(a==='addnote'){const tx=$('#n-txt').value.trim();if(!tx)return;await pset('notes',{id:'n'+Date.now().toString(36),txt:tx,tp:$('#n-tp').value,date:today(),createdAt:Date.now()});render()}
 else if(a==='delnote'){await pdel('notes',d.id);render()}
 else if(a==='preset'){ST.cmpA=d.a;ST.cmpB=d.b;render()}
 else if(a==='mksnap'){const cs=curSnap();const ts=Date.now();const lab=($('#snlab').value||'').trim()||('Snapshot manual '+fd(refDate())+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));await pset('snapshots',{id:'snap-'+ts,ts,date:cs.date,label:lab,origin:'Cópia do snapshot atual',tasks:cs.tasks.map(t=>Object.assign({},t)),ado:cs.ado||null,oth:cs.oth||null,note:''});render()}
 else if(a==='aigen')aiGen();else if(a==='aistop'){if(aiCtl)aiCtl.abort()}
 else if(a==='imptxt'){const v=$('#imptxt').value.trim();if(!v){flash('Cole o conteúdo CSV na caixa.');return}setImp(parseCSV(v),'texto colado');render()}
 else if(a==='impapply')await impApply();
 else if(a==='expcsv'){const cs=curSnap();const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const csv='ID;Title;State;Assigned To;Demanda;Original Estimate;Completed Work;Remaining Work;Iteration Path\n'+cs.tasks.map(t=>[t.id,q((META[t.id]||{}).t),q(t.s),q(t.r),t.d,t.est,t.cw,t.rem,q(t.it)].join(';')).join('\n');try{await ST.dl.save({filename:'snapshot-'+cs.date+'.csv',data:'﻿'+csv})}catch(e){flash('Download não concluído.')}}}

ST.snaps=mkSnapshots();
const PAGES_BY_HASH=NAV.map(n=>n[0]);try{const h=(location.hash||'').slice(1);if(PAGES_BY_HASH.includes(h))ST.page=h}catch(_){}
window.addEventListener('hashchange',()=>{try{const h=(location.hash||'').slice(1);if(PAGES_BY_HASH.includes(h)&&h!==ST.page){ST.page=h;render()}}catch(_){}});
render();initCaps();

/* ===== Print de tela -> área de transferência ===== */
let SHOT_BLOB=null;
function shotBtn(){return '<button class="shotb noshot" data-act="shot" title="Copiar print desta página (colar com Ctrl+V)">📷 Copiar print</button>'}
function shotModal(url,why){
  const o=document.createElement('div');o.id='shotov';
  o.innerHTML='<div class="bx"><div><b>Print gerado.</b> '+esc(why)+' Clique com o botão direito na imagem → <b>Copiar imagem</b>.</div><img src="'+url+'" alt="Print da página"><div class="row" style="display:flex;gap:8px"><button class="shotb" data-act="shotdl">⬇ Baixar PNG</button><button class="shotb" data-act="shotclose">Fechar</button></div></div>';
  document.body.appendChild(o);
}
async function shotDl(){
  if(!SHOT_BLOB)return;
  try{const s=await claude.use('downloads');if(!s){flash('Download indisponível');return}
    const buf=new Uint8Array(await SHOT_BLOB.arrayBuffer());
    await s.save({filename:'print-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.png',data:buf})}
  catch(e){flash('Download não concluído')}
}
async function shot(){
  const btn=$('.shotb[data-act="shot"]');
  if(!window.html2canvas){flash('Biblioteca de captura indisponível');return}
  const dr=$('.drawer');const el=dr||$('.main');
  const bg=getComputedStyle(document.body).backgroundColor;
  if(btn){btn.disabled=true;btn.textContent='Gerando…'}
  try{
    const big=el.scrollHeight>5000;
    const canvas=await html2canvas(el,{backgroundColor:bg,scale:big?1:2,useCORS:true,logging:false,
      windowWidth:document.documentElement.clientWidth,
      ignoreElements:n=>n.classList&&n.classList.contains('noshot'),
      onclone:(doc,node)=>{
        const t=doc.querySelector('.top');if(t)t.style.position='static';
        if(dr){const c=doc.querySelector('.drawer');if(c){c.style.position='static';c.style.overflow='visible';c.style.height='auto';c.style.width=dr.clientWidth+'px'}}
      }});
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob)throw new Error('blob');
    SHOT_BLOB=blob;
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      flash('Print copiado. Cole com Ctrl+V onde quiser.');
    }catch(e){
      shotModal(URL.createObjectURL(blob),'O navegador não permitiu copiar automaticamente.');
    }
  }catch(e){flash('Não foi possível gerar o print: '+(e&&e.message||e))}
  finally{const b=$('.shotb[data-act="shot"]');if(b){b.disabled=false;b.innerHTML='📷 Copiar print'}}
}
